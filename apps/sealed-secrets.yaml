# Sealed Secrets controller, installed as a GitOps-managed Helm release.
#
# ADR summary (full version in docs/): Sealed Secrets over SOPS (needs an
# ArgoCD plugin) and External Secrets Operator (needs a real external store).
# Ciphertext is safe to commit to a public repo; only the controller's
# in-cluster private key can decrypt it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # controller must exist before SealedSecrets are applied
spec:
  project: default
  source:
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.17.3   # pinned, same discipline as image digests
    helm:
      releaseName: sealed-secrets
      parameters:
        # kubeseal's default expects the controller here with this name
        - name: fullnameOverride
          value: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
