# CloudNativePG operator - the stretch goal (DB operator + backup).
# Installed exactly like sealed-secrets: a GitOps-managed, pinned Helm release.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # operator/CRDs before any Cluster resource
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    # Pinned to a validated release line. Deliberately NOT the newest: this
    # line ships in-tree barmanObjectStore backup support (deprecated in favor
    # of a plugin in newer lines), which keeps the backup config self-contained.
    targetRevision: 0.22.1
    helm:
      releaseName: cnpg
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # CNPG CRDs are large; avoids the annotation size limit
