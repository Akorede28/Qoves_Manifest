apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2" # after the controller, before the workloads that consume it
spec:
  project: default
  source:
    repoURL: https://github.com/Akorede28/Qoves_Manifest.git
    targetRevision: main
    path: manifests/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
