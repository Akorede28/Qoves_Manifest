name: build-and-push-image

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/akorede28/qoves-api   # GHCR requires lowercase

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # lets the built-in GITHUB_TOKEN push to GHCR

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          # Immutable tag per commit; never :latest (explicit self-check item).
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Print digest for pinning in manifests
        run: |
          echo "Pin this in the Deployment manifest:"
          echo "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"
